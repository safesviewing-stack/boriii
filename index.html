<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corazón Morado 3D</title>
    <style>
        /* Forzamos el negro absoluto para que nada lo sobreescriba */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000 !important; 
            background-color: #000000 !important;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const particulas = [];
        const numLuces = 3000; 

        // Generamos el corazón
        while (particulas.length < numLuces) {
            let x = (Math.random() - 0.5) * 3;
            let y = (Math.random() - 0.5) * 3;
            let z = (Math.random() - 0.5) * 3;
            
            let x2 = x * x;
            let y2 = y * y;
            let z2 = z * z;
            
            let a = x2 + 2.25 * y2 + z2 - 1;
            let valor = (a * a * a) - (x2 * (z2 * z)) - (0.1125 * y2 * (z2 * z));
            
            if (valor <= 0.0 && valor > -0.2) {
                // Tonos violetas, lilas, púrpuras y morados
                let tono = 260 + Math.random() * 50; 
                let saturacion = 70 + Math.random() * 30; 
                let luz = 50 + Math.random() * 35; 
                
                particulas.push({
                    baseX: x,
                    baseY: y,
                    baseZ: z,
                    color: `hsl(${tono}, ${saturacion}%, ${luz}%)`,
                    size: Math.random() * 1.8 + 0.8
                });
            }
        }

        let anguloGiro = 0;

        function animar() {
            // Fondo 100% negro sólido en cada fotograma, sin transparencias
            ctx.fillStyle = '#000000'; 
            ctx.fillRect(0, 0, width, height);

            anguloGiro += 0.015; 

            const centroX = width / 2;
            const centroY = height / 2;
            const escala = Math.min(width, height) * 0.28;

            let particulasProyectadas = [];

            particulas.forEach(p => {
                let rotX = p.baseX * Math.cos(anguloGiro) - p.baseY * Math.sin(anguloGiro);
                let rotY = p.baseX * Math.sin(anguloGiro) + p.baseY * Math.cos(anguloGiro);
                let rotZ = p.baseZ;

                const inclinacion = 0.25; 
                let finalX = rotX;
                let finalY = rotY * Math.cos(inclinacion) - rotZ * Math.sin(inclinacion); 
                let finalZ = rotY * Math.sin(inclinacion) + rotZ * Math.cos(inclinacion); 

                particulasProyectadas.push({
                    x: finalX,
                    y: finalY,
                    z: finalZ,
                    color: p.color,
                    size: p.size
                });
            });

            particulasProyectadas.sort((a, b) => b.y - a.y);

            particulasProyectadas.forEach(p => {
                const fov = 350;
                const perspectiva = fov / (fov + p.y * 100);
                
                const proyX = centroX + p.x * escala * perspectiva;
                const proyY = centroY - p.z * escala * perspectiva;

                ctx.beginPath();
                const tamañoFinal = Math.max(0.1, p.size * perspectiva);
                ctx.arc(proyX, proyY, tamañoFinal, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                
                ctx.shadowBlur = 5;
                ctx.shadowColor = p.color;
                
                ctx.fill();
            });

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
