<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corazón Morado 3D</title>
    <style>
        /* Forzamos el negro absoluto para que nada lo sobreescriba */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000000 !important; 
            background-color: #000000 !important;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 1. Detección de dispositivo móvil para adaptar la densidad
        const esMovil = width < 768;
        // Reducimos el número de luces en móviles (se ve igual de denso debido a la pantalla pequeña)
        const numLuces = esMovil ? 1500 : 3000; 
        const particulas = [];

        // Generamos el corazón
        while (particulas.length < numLuces) {
            let x = (Math.random() - 0.5) * 3;
            let y = (Math.random() - 0.5) * 3;
            let z = (Math.random() - 0.5) * 3;
            
            let x2 = x * x;
            let y2 = y * y;
            let z2 = z * z;
            
            let a = x2 + 2.25 * y2 + z2 - 1;
            let valor = (a * a * a) - (x2 * (z2 * z)) - (0.1125 * y2 * (z2 * z));
            
            if (valor <= 0.0 && valor > -0.2) {
                let tono = 260 + Math.random() * 50; 
                let saturacion = 70 + Math.random() * 30; 
                let luz = 50 + Math.random() * 35; 
                
                // 2. Incrementamos ligeramente el tamaño en móviles para compensar pantallas de alta resolución (DPI)
                let tamañoBase = Math.random() * 1.8 + 0.8;
                if (esMovil) tamañoBase *= 1.3;

                particulas.push({
                    baseX: x,
                    baseY: y,
                    baseZ: z,
                    color: `hsl(${tono}, ${saturacion}%, ${luz}%)`,
                    size: tamañoBase,
                    // Pre-asignamos propiedades para evitar la creación dinámica de objetos en la animación
                    proyX: 0,
                    proyY: 0,
                    depth: 0,
                    finalSize: 0
                });
            }
        }

        let anguloGiro = 0;
        const inclinacion = 0.25; 
        const cosInc = Math.cos(inclinacion);
        const sinInc = Math.sin(inclinacion);
        const fov = 350;

        function animar() {
            ctx.fillStyle = '#000000'; 
            ctx.fillRect(0, 0, width, height);

            anguloGiro += 0.015; 

            // 3. Precalculamos el seno y coseno del giro una sola vez por frame
            const cosGiro = Math.cos(anguloGiro);
            const sinGiro = Math.sin(anguloGiro);

            const centroX = width / 2;
            const centroY = height / 2;
            const escala = Math.min(width, height) * 0.28;

            // 4. Proyección en el mismo array (evita crear y desechar arrays u objetos nuevos continuamente)
            for (let i = 0; i < particulas.length; i++) {
                const p = particulas[i];

                let rotX = p.baseX * cosGiro - p.baseY * sinGiro;
                let rotY = p.baseX * sinGiro + p.baseY * cosGiro;
                let rotZ = p.baseZ;

                let finalX = rotX;
                let finalY = rotY * cosInc - rotZ * sinInc; 
                let finalZ = rotY * sinInc + rotZ * cosInc; 

                const perspectiva = fov / (fov + finalY * 100);
                
                p.proyX = centroX + finalX * escala * perspectiva;
                p.proyY = centroY - finalZ * escala * perspectiva;
                p.depth = finalY; 
                p.finalSize = Math.max(0.1, p.size * perspectiva);
            }

            // 5. Ordenamos el array existente "in-place"
            particulas.sort((a, b) => b.depth - a.depth);

            // 6. Usamos mezcla de color 'screen' para emular brillo en superposiciones sin penalizar rendimiento
            ctx.globalCompositeOperation = 'screen';

            for (let i = 0; i < particulas.length; i++) {
                const p = particulas[i];
                ctx.beginPath();
                ctx.arc(p.proyX, p.proyY, p.finalSize, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
            }

            // Restauramos el modo por defecto para el limpiado del siguiente frame
            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
