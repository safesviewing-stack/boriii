<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Bori</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Fondo elegante oscuro */
            background: radial-gradient(circle at center, #1b000b 0%, #000000 100%);
        }

        canvas {
            display: block;
        }

        /* Contenedor del texto centrado */
        #texto-elegante {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        /* Estilo para el nombre */
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 6rem;
            margin: 0;
            font-style: italic;
            font-weight: 600;
            letter-spacing: 2px;
            /* Degradado dorado y oro rosa */
            background: linear-gradient(45deg, #ffd700, #ffb6c1, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 0px 30px rgba(255, 182, 193, 0.4);
            animation: flotar 4s ease-in-out infinite;
        }

        /* Animación suave de flotación */
        @keyframes flotar {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
    </style>
</head>
<body>

    <div id="texto-elegante">
        <h1>Bori</h1>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const particulas = [];
        const numLuces = 3000; // Cantidad perfecta para mantener un 3D sólido y fluido

        // Generamos el corazón usando la ecuación matemática 3D de Taubin
        while (particulas.length < numLuces) {
            let x = (Math.random() - 0.5) * 3;
            let y = (Math.random() - 0.5) * 3;
            let z = (Math.random() - 0.5) * 3;
            
            let x2 = x * x;
            let y2 = y * y;
            let z2 = z * z;
            
            // Fórmula del corazón en 3D
            let a = x2 + 2.25 * y2 + z2 - 1;
            let valor = (a * a * a) - (x2 * (z2 * z)) - (0.1125 * y2 * (z2 * z));
            
            // Creamos un grosor (volumen de la cáscara del corazón)
            if (valor <= 0.0 && valor > -0.2) {
                // Colores elegantes
                let tonoHSL = Math.random() < 0.5 ? 340 + Math.random() * 20 : 35 + Math.random() * 15; 
                let brillo = 50 + Math.random() * 50;
                
                particulas.push({
                    baseX: x,
                    baseY: y, // Profundidad
                    baseZ: z, // Altura
                    color: `hsl(${tonoHSL}, 80%, ${brillo}%)`,
                    size: Math.random() * 1.8 + 0.8
                });
            }
        }

        let anguloGiro = 0;

        function animar() {
            // Limpiamos el frame anterior suavemente
            ctx.fillStyle = 'rgba(20, 0, 10, 0.6)'; 
            ctx.fillRect(0, 0, width, height);

            anguloGiro += 0.015; // Velocidad a la que da vueltas

            const centroX = width / 2;
            const centroY = height / 2 + 20;
            const escala = Math.min(width, height) * 0.28;

            let particulasProyectadas = [];

            // Calculamos la posición 3D de cada luz
            particulas.forEach(p => {
                // Rotación sobre el eje vertical para que dé vueltas enteras
                let rotX = p.baseX * Math.cos(anguloGiro) - p.baseY * Math.sin(anguloGiro);
                let rotY = p.baseX * Math.sin(anguloGiro) + p.baseY * Math.cos(anguloGiro);
                let rotZ = p.baseZ;

                // Inclinación hacia adelante para apreciar el volumen desde un poco más arriba
                const inclinacion = 0.25; 
                let finalX = rotX;
                let finalY = rotY * Math.cos(inclinacion) - rotZ * Math.sin(inclinacion); // Profundidad final
                let finalZ = rotY * Math.sin(inclinacion) + rotZ * Math.cos(inclinacion); // Altura final

                // Guardamos todo para ordenarlo luego
                particulasProyectadas.push({
                    x: finalX,
                    y: finalY, // Usamos la Y como profundidad (Z-buffer)
                    z: finalZ,
                    color: p.color,
                    size: p.size
                });
            });

            // ORDENAMIENTO 3D: Dibujamos primero las luces más lejanas y luego las más cercanas
            // Esto es lo que crea el efecto de que el corazón sea un volumen sólido e "hinchado"
            particulasProyectadas.sort((a, b) => b.y - a.y);

            // Renderizamos en pantalla
            particulasProyectadas.forEach(p => {
                // Perspectiva: lo que está más lejos se ve más pequeño y más al centro
                const fov = 350;
                const perspectiva = fov / (fov + p.y * 100);
                
                const proyX = centroX + p.x * escala * perspectiva;
                // Restamos la Z porque en las pantallas el eje Y crece hacia abajo, y queremos que el corazón apunte hacia arriba
                const proyY = centroY - p.z * escala * perspectiva;

                ctx.beginPath();
                const tamañoFinal = Math.max(0.1, p.size * perspectiva);
                ctx.arc(proyX, proyY, tamañoFinal, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                
                // Brillo
                ctx.shadowBlur = 4;
                ctx.shadowColor = p.color;
                
                ctx.fill();
            });

            requestAnimationFrame(animar);
        }

        animar();
    </script>
</body>
</html>
